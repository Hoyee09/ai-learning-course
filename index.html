<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向大一学生的 8 周 AI 入门交互课件：学习路线、每日任务、资源、项目验收与进度记录。">
  <title>AI 起步实验室 · 8 周交互学习课件</title>
  <style>
    :root {
      --ink: #17211d;
      --ink-2: #25372f;
      --muted: #66756e;
      --paper: #f4f1e8;
      --paper-2: #ebe6d9;
      --card: #fffdf8;
      --line: #dfe1d7;
      --accent: #177a65;
      --accent-soft: #dcefe8;
      --orange: #e8783f;
      --orange-soft: #fbe6d9;
      --gold: #d4a83e;
      --blue: #3f6f9e;
      --sidebar: #163229;
      --sidebar-2: #1d4337;
      --lime: #b9e07b;
      --danger: #b84a3a;
      --shadow: 0 14px 40px rgba(23, 33, 29, 0.08);
      --radius: 22px;
      --radius-sm: 14px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% 5%, rgba(232, 120, 63, 0.09), transparent 22rem),
        radial-gradient(circle at 45% 0%, rgba(23, 122, 101, 0.08), transparent 28rem),
        var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.65;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      letter-spacing: -0.02em;
      line-height: 1.18;
    }

    h1 {
      font-size: clamp(2.35rem, 5vw, 4.35rem);
      margin-bottom: 20px;
    }

    h2 {
      font-size: clamp(1.55rem, 3vw, 2.35rem);
      margin-bottom: 14px;
    }

    h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
    }

    .skip-link {
      position: fixed;
      top: -60px;
      left: 16px;
      z-index: 999;
      padding: 10px 16px;
      border-radius: 10px;
      color: #fff;
      background: var(--ink);
      transition: top 0.2s ease;
    }

    .skip-link:focus {
      top: 12px;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: 282px;
      padding: 24px 18px 30px;
      color: #eff7f2;
      background:
        radial-gradient(circle at 20% 0%, rgba(185, 224, 123, 0.13), transparent 16rem),
        linear-gradient(180deg, var(--sidebar), #10251e);
      overflow-y: auto;
      transition: transform 0.24s ease;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 4px 8px 22px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      color: #193329;
      background: var(--lime);
      font-weight: 900;
      letter-spacing: -0.06em;
      box-shadow: 0 8px 24px rgba(185, 224, 123, 0.2);
    }

    .brand strong {
      display: block;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 1.12rem;
      letter-spacing: 0.02em;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: rgba(239, 247, 242, 0.6);
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .overall {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 4px 22px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
    }

    .progress-ring {
      --p: 0%;
      position: relative;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: conic-gradient(var(--lime) var(--p), rgba(255, 255, 255, 0.12) 0);
    }

    .progress-ring::after {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: var(--sidebar);
      content: "";
    }

    .progress-ring span {
      position: relative;
      z-index: 1;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .overall small {
      display: block;
      color: rgba(239, 247, 242, 0.55);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .overall strong {
      display: block;
      margin-top: 2px;
      font-size: 0.95rem;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      margin: 0 0 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      color: rgba(239, 247, 242, 0.72);
      background: transparent;
      text-align: left;
      transition: 0.18s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-item.active {
      box-shadow: inset 3px 0 0 var(--lime);
    }

    .nav-item span {
      color: rgba(239, 247, 242, 0.3);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }

    .week-nav-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 10px;
      color: rgba(239, 247, 242, 0.42);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .week-nav-label::after {
      width: 36px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      content: "";
    }

    .week-nav {
      display: grid;
      gap: 3px;
    }

    .week-nav-item {
      position: relative;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 9px;
      align-items: center;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 12px;
      color: rgba(239, 247, 242, 0.66);
      background: transparent;
      text-align: left;
      transition: 0.18s ease;
    }

    .week-nav-item:hover,
    .week-nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .week-nav-item.active {
      box-shadow: inset 3px 0 0 var(--orange);
    }

    .week-dot {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .week-nav-text {
      min-width: 0;
    }

    .week-nav-text strong {
      display: block;
      overflow: hidden;
      font-size: 0.82rem;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .week-nav-text small {
      display: block;
      color: rgba(239, 247, 242, 0.4);
      font-size: 0.68rem;
    }

    .week-nav-bar {
      position: absolute;
      right: 10px;
      bottom: 5px;
      left: 49px;
      height: 2px;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
    }

    .week-nav-bar i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--lime);
      transition: width 0.25s ease;
    }

    .sidebar-foot {
      margin: 24px 8px 0;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(239, 247, 242, 0.38);
      font-size: 0.7rem;
      line-height: 1.55;
    }

    .main {
      min-height: 100vh;
      margin-left: 282px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 68px;
      padding: 0 30px;
      border-bottom: 1px solid rgba(23, 33, 29, 0.08);
      background: rgba(244, 241, 232, 0.86);
      backdrop-filter: blur(16px);
    }

    .menu-btn {
      display: none;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--card);
      font-size: 1.1rem;
    }

    .breadcrumb {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.82rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .breadcrumb strong {
      color: var(--ink);
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .save-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .ghost-btn,
    .primary-btn,
    .secondary-btn,
    .mini-btn,
    .danger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 15px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .primary-btn {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(23, 122, 101, 0.18);
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .ghost-btn:hover,
    .mini-btn:hover {
      transform: translateY(-1px);
    }

    .secondary-btn {
      color: var(--ink);
      border-color: var(--line);
      background: var(--card);
    }

    .ghost-btn {
      color: var(--ink);
      border-color: var(--line);
      background: transparent;
    }

    .mini-btn {
      min-height: 30px;
      padding: 4px 10px;
      border-color: var(--line);
      color: var(--muted);
      background: transparent;
      font-size: 0.72rem;
    }

    .danger-btn {
      color: var(--danger);
      border-color: rgba(184, 74, 58, 0.25);
      background: rgba(184, 74, 58, 0.05);
    }

    .view-root {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 30px 32px 76px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(310px, 0.75fr);
      gap: 22px;
      margin-bottom: 22px;
    }

    .hero-copy {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 4.5vw, 50px);
      border-radius: 30px;
      color: #f8f4e8;
      background:
        radial-gradient(circle at 86% 18%, rgba(185, 224, 123, 0.22), transparent 30%),
        radial-gradient(circle at 8% 100%, rgba(232, 120, 63, 0.2), transparent 38%),
        linear-gradient(135deg, #1c3d32, #12241e);
      box-shadow: var(--shadow);
    }

    .hero-copy::after {
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      box-shadow:
        0 0 0 34px rgba(255, 255, 255, 0.035),
        0 0 0 68px rgba(255, 255, 255, 0.022);
      content: "";
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .hero-copy .eyebrow {
      color: var(--lime);
    }

    .eyebrow::before {
      width: 20px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .hero-copy h1 em {
      color: var(--lime);
      font-style: normal;
    }

    .hero-copy p {
      max-width: 580px;
      margin-bottom: 24px;
      color: rgba(248, 244, 232, 0.68);
      font-size: 0.98rem;
    }

    .hero-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-copy .secondary-btn {
      color: #f8f4e8;
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
    }

    .hero-copy .primary-btn {
      color: #173127;
      background: var(--lime);
      box-shadow: none;
    }

    .hero-panel {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        radial-gradient(circle at 100% 0%, rgba(232, 120, 63, 0.12), transparent 14rem),
        var(--card);
      box-shadow: var(--shadow);
    }

    .mini-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mini-label span:last-child {
      color: var(--orange);
      letter-spacing: 0;
      text-transform: none;
    }

    .next-card {
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    #nextActionBody {
      display: flex;
      flex: 1;
    }

    .next-card .next-kicker {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .next-card h2 {
      margin: 8px 0 10px;
      font-size: 1.6rem;
    }

    .next-card .next-task {
      margin-bottom: 14px;
      color: var(--ink-2);
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .next-output {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      color: var(--ink-2);
      background: var(--paper);
      font-size: 0.78rem;
    }

    .next-output strong {
      color: var(--accent);
    }

    .next-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.78);
    }

    .stat-card small {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .stat-card strong {
      display: block;
      margin-top: 2px;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .stat-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .section-block {
      margin-top: 30px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
    }

    .section-head h2 {
      margin-bottom: 0;
      font-size: clamp(1.45rem, 2.5vw, 2rem);
    }

    .section-head p {
      max-width: 640px;
      margin-bottom: 0;
      font-size: 0.85rem;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 0 rgba(23, 33, 29, 0.02);
    }

    .panel.soft {
      background: rgba(255, 253, 248, 0.62);
      box-shadow: none;
    }

    .prep-card {
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
      gap: 24px;
      align-items: start;
    }

    .prep-copy h3 {
      font-size: 1.45rem;
    }

    .prep-copy p {
      font-size: 0.84rem;
    }

    .prep-progress {
      margin-top: 18px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--paper-2);
    }

    .progress-track i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #49a88f);
      transition: width 0.3s ease;
    }

    .prep-progress small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .check-list {
      display: grid;
      gap: 7px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 20px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px 11px;
      border-radius: 11px;
      color: var(--ink-2);
      font-size: 0.8rem;
      transition: background 0.16s ease;
    }

    .check-row:hover {
      background: var(--paper);
    }

    .check-row input {
      margin-top: 3px;
    }

    .check-row small {
      color: var(--muted);
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .check-row.done span {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .week-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 205px;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--card);
      text-align: left;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .week-card:hover {
      transform: translateY(-3px);
      border-color: rgba(23, 122, 101, 0.28);
      box-shadow: var(--shadow);
    }

    .week-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .week-index {
      font-family: "Songti SC", "STSong", Georgia, serif;
      color: var(--paper-2);
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.08em;
    }

    .week-card h3 {
      margin-bottom: 6px;
      font-size: 1.2rem;
    }

    .week-card p {
      flex: 1;
      margin-bottom: 16px;
      font-size: 0.78rem;
    }

    .week-card-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .week-card-foot .progress-track {
      flex: 1;
      height: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .badge.orange {
      color: #a54f27;
      background: var(--orange-soft);
    }

    .badge.gold {
      color: #7c5b0f;
      background: #f7edcf;
    }

    .badge.gray {
      color: var(--muted);
      background: var(--paper-2);
    }

    .project-preview {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 26px;
      align-items: center;
    }

    .project-preview h3 {
      font-size: 1.6rem;
    }

    .pipeline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
    }

    .pipeline span {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink-2);
      background: var(--paper);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .pipeline i {
      color: var(--orange);
      font-style: normal;
      font-weight: 800;
    }

    .project-diagram {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      padding: 16px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(23, 122, 101, 0.08), rgba(232, 120, 63, 0.06)),
        var(--paper);
    }

    .diagram-node {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 58px;
      padding: 10px;
      border: 1px solid rgba(23, 33, 29, 0.08);
      border-radius: 13px;
      background: rgba(255, 253, 248, 0.82);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .diagram-node b {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #fff;
      background: var(--accent);
      font-size: 0.68rem;
    }

    .diagram-node:nth-child(2) b {
      background: var(--orange);
    }

    .diagram-node:nth-child(3) b {
      background: var(--blue);
    }

    .diagram-node:nth-child(4) b {
      background: var(--gold);
    }

    .page-head {
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 4vw, 3.35rem);
    }

    .page-head p {
      max-width: 760px;
      margin-bottom: 0;
    }

    .phase-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .phase-card {
      position: relative;
      overflow: hidden;
      padding: 21px;
      border-radius: 19px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .phase-card::after {
      position: absolute;
      right: -18px;
      bottom: -26px;
      color: rgba(23, 33, 29, 0.04);
      font-family: "Songti SC", Georgia, serif;
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      content: attr(data-n);
    }

    .phase-card h3 {
      margin: 6px 0 8px;
      font-size: 1.2rem;
    }

    .phase-card p {
      margin-bottom: 0;
      font-size: 0.78rem;
    }

    .roadmap-list {
      display: grid;
      gap: 12px;
    }

    .roadmap-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 160px;
      gap: 20px;
      align-items: center;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      text-align: left;
      transition: 0.18s ease;
    }

    .roadmap-row:hover {
      border-color: rgba(23, 122, 101, 0.3);
      transform: translateX(3px);
    }

    .roadmap-num {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Songti SC", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .roadmap-copy h3 {
      margin-bottom: 4px;
      font-size: 1.1rem;
    }

    .roadmap-copy p {
      margin-bottom: 5px;
      font-size: 0.78rem;
    }

    .roadmap-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 7px;
      color: var(--muted);
      background: var(--paper);
      font-size: 0.66rem;
    }

    .roadmap-progress {
      text-align: right;
    }

    .roadmap-progress strong {
      display: block;
      font-size: 0.76rem;
    }

    .roadmap-progress small {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .direction-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .direction-card h3 {
      font-size: 1.1rem;
    }

    .direction-card p {
      font-size: 0.78rem;
    }

    .week-hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      padding: clamp(26px, 4vw, 42px);
      border-radius: 28px;
      color: #f8f4e8;
      background:
        radial-gradient(circle at 90% 10%, rgba(185, 224, 123, 0.18), transparent 26%),
        linear-gradient(135deg, #1b3b31, #14271f);
    }

    .week-hero::after {
      position: absolute;
      right: -60px;
      bottom: -110px;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgba(255, 255, 255, 0.03);
      content: "";
    }

    .week-hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .week-hero .badge {
      color: var(--lime);
      background: rgba(185, 224, 123, 0.12);
    }

    .week-hero h1 {
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
      font-size: clamp(2rem, 4.2vw, 3.4rem);
    }

    .week-hero p {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin-bottom: 18px;
      color: rgba(248, 244, 232, 0.7);
    }

    .week-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .week-meta span {
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      color: rgba(248, 244, 232, 0.78);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.72rem;
    }

    .week-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 20px;
      align-items: start;
    }

    .week-main {
      display: grid;
      gap: 18px;
    }

    .week-side {
      position: sticky;
      top: 88px;
      display: grid;
      gap: 14px;
    }

    .week-section {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }

    .week-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .week-section-head h2 {
      margin-bottom: 0;
      font-size: 1.35rem;
    }

    .objective-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: objective;
    }

    .objective-list li {
      display: grid;
      grid-template-columns: 25px 1fr;
      gap: 10px;
      align-items: start;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      color: var(--ink-2);
      font-size: 0.84rem;
      counter-increment: objective;
    }

    .objective-list li:last-child {
      border-bottom: 0;
    }

    .objective-list li::before {
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      margin-top: 1px;
      border-radius: 8px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 0.7rem;
      font-weight: 800;
      content: counter(objective, decimal-leading-zero);
    }

    .resource-list {
      display: grid;
      gap: 9px;
    }

    .resource-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--paper);
    }

    .resource-row h4 {
      margin: 0 0 2px;
      font-size: 0.86rem;
    }

    .resource-row p {
      margin: 0;
      font-size: 0.72rem;
    }

    .resource-row .resource-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .resource-row .mini-btn {
      white-space: nowrap;
    }

    .task-list {
      display: grid;
      gap: 9px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: start;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .task-row:hover {
      border-color: rgba(23, 122, 101, 0.28);
    }

    .task-row.done {
      background: rgba(220, 239, 232, 0.35);
      border-color: rgba(23, 122, 101, 0.18);
    }

    .task-row > input {
      margin-top: 4px;
    }

    .task-body {
      cursor: pointer;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .task-meta span:first-child {
      color: var(--accent);
      font-weight: 800;
    }

    .task-body h4 {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .task-body p {
      margin: 0 0 6px;
      color: var(--ink-2);
      font-size: 0.8rem;
      line-height: 1.65;
    }

    .task-output {
      color: var(--muted);
      font-size: 0.7rem;
    }

    .task-output strong {
      color: var(--orange);
    }

    .task-row.done .task-body h4 {
      color: var(--muted);
      text-decoration: line-through;
    }

    .deliverable-box {
      padding: 18px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(23, 122, 101, 0.08), rgba(232, 120, 63, 0.04)),
        var(--paper);
    }

    .deliverable-box h3 {
      margin-bottom: 7px;
    }

    .deliverable-box > p {
      margin-bottom: 13px;
      font-size: 0.82rem;
    }

    .steps {
      display: grid;
      gap: 7px;
      margin: 0 0 16px;
      padding-left: 20px;
      color: var(--ink-2);
      font-size: 0.8rem;
    }

    .acceptance-list {
      display: grid;
      gap: 5px;
      padding-top: 12px;
      border-top: 1px dashed rgba(23, 33, 29, 0.12);
    }

    .side-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
    }

    .side-card h3 {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .week-side .progress-ring {
      width: 68px;
      height: 68px;
      background: conic-gradient(var(--accent) var(--p), var(--paper-2) 0);
    }

    .week-side .progress-ring::after {
      background: var(--card);
    }

    .week-side .progress-ring span {
      color: var(--ink);
    }

    .side-progress {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .side-progress strong {
      display: block;
      font-size: 0.9rem;
    }

    .side-progress small {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .rhythm-list {
      display: grid;
      gap: 7px;
    }

    .rhythm-item {
      display: grid;
      grid-template-columns: 20px 1fr auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .rhythm-dot {
      display: block;
      width: 8px;
      height: 8px;
      margin-left: 5px;
      border-radius: 50%;
      background: var(--paper-2);
    }

    .rhythm-item.done .rhythm-dot {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 122, 101, 0.1);
    }

    .rhythm-item.done span:nth-child(2) {
      color: var(--ink-2);
    }

    .note-field {
      display: grid;
      gap: 5px;
      margin-bottom: 12px;
    }

    .note-field label {
      color: var(--ink-2);
      font-size: 0.74rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 78px;
      padding: 10px 12px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: var(--paper);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    textarea:focus,
    input:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid rgba(23, 122, 101, 0.45);
      outline-offset: 2px;
    }

    .mini-quiz {
      display: grid;
      gap: 8px;
    }

    details.mini-quiz-item {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    details.mini-quiz-item summary {
      cursor: pointer;
      color: var(--ink-2);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .mini-quiz-answer {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--line);
      color: var(--ink-2);
      font-size: 0.75rem;
    }

    .mini-quiz-answer strong {
      color: var(--accent);
    }

    .callout {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(232, 120, 63, 0.18);
      border-radius: 14px;
      color: var(--ink-2);
      background: rgba(251, 230, 217, 0.45);
      font-size: 0.78rem;
    }

    .callout b {
      flex: 0 0 auto;
      color: var(--orange);
    }

    .resource-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      height: 42px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--card);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: 0.72rem;
      transition: 0.16s ease;
    }

    .chip:hover,
    .chip.active {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .resource-card {
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
    }

    .resource-card .badge {
      align-self: flex-start;
      margin-bottom: 10px;
    }

    .resource-card h3 {
      margin-bottom: 5px;
      font-size: 1.02rem;
    }

    .resource-card p {
      flex: 1;
      margin-bottom: 12px;
      font-size: 0.78rem;
    }

    .resource-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 36px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 0.82rem;
    }

    .quiz-shell {
      max-width: 780px;
      margin: 0 auto;
    }

    .quiz-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .quiz-progress {
      height: 7px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--paper-2);
    }

    .quiz-progress i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #52ad94);
      transition: width 0.25s ease;
    }

    .quiz-card {
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .quiz-card h2 {
      margin: 8px 0 20px;
      font-size: clamp(1.35rem, 2.8vw, 1.9rem);
    }

    .quiz-options {
      display: grid;
      gap: 9px;
    }

    .quiz-option {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink-2);
      background: var(--paper);
      text-align: left;
      font-size: 0.83rem;
      transition: 0.16s ease;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: rgba(23, 122, 101, 0.4);
      background: var(--accent-soft);
    }

    .quiz-option:disabled {
      cursor: default;
      opacity: 1;
    }

    .quiz-option.correct {
      border-color: rgba(23, 122, 101, 0.4);
      background: var(--accent-soft);
      color: #0f5f4e;
      font-weight: 700;
    }

    .quiz-option.wrong {
      border-color: rgba(184, 74, 58, 0.32);
      background: rgba(184, 74, 58, 0.06);
      color: #8e392d;
    }

    .quiz-feedback {
      margin-top: 15px;
      padding: 13px 15px;
      border-radius: 12px;
      background: var(--paper);
      font-size: 0.8rem;
    }

    .quiz-feedback strong {
      display: block;
      margin-bottom: 3px;
      color: var(--accent);
    }

    .quiz-feedback.bad strong {
      color: var(--danger);
    }

    .quiz-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    .score-panel {
      padding: 32px;
      border-radius: 24px;
      color: #f8f4e8;
      background:
        radial-gradient(circle at 90% 10%, rgba(185, 224, 123, 0.2), transparent 30%),
        linear-gradient(135deg, #1b3b31, #12241e);
      text-align: center;
    }

    .score-panel .score-number {
      margin: 10px 0 4px;
      color: var(--lime);
      font-family: "Songti SC", Georgia, serif;
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-panel p {
      color: rgba(248, 244, 232, 0.68);
    }

    .quiz-review {
      display: grid;
      gap: 8px;
      margin-top: 18px;
      text-align: left;
    }

    .review-row {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.76rem;
    }

    .review-row strong {
      display: block;
      margin-bottom: 3px;
    }

    .review-row.bad strong {
      color: #ffb39f;
    }

    .review-row.good strong {
      color: var(--lime);
    }

    .notes-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.8fr);
      gap: 18px;
      align-items: start;
    }

    .notes-panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }

    .notes-panel textarea {
      min-height: 105px;
    }

    .notes-panel textarea.large {
      min-height: 250px;
    }

    .week-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .week-picker .chip {
      min-width: 40px;
      text-align: center;
    }

    .data-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .danger-zone {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }

    .danger-zone p {
      margin-bottom: 9px;
      font-size: 0.73rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 120;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      border-radius: 12px;
      color: #f8f4e8;
      background: var(--ink);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      font-size: 0.78rem;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .focus-modal[hidden] {
      display: none;
    }

    .focus-modal {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 20, 16, 0.72);
      backdrop-filter: blur(8px);
    }

    .focus-card {
      position: relative;
      width: min(480px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: clamp(24px, 5vw, 38px);
      border-radius: 28px;
      color: #f8f4e8;
      background:
        radial-gradient(circle at 100% 0%, rgba(185, 224, 123, 0.18), transparent 40%),
        linear-gradient(145deg, #1c3d32, #11221c);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .focus-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: rgba(248, 244, 232, 0.7);
      background: transparent;
      font-size: 1.1rem;
    }

    .focus-card .eyebrow {
      color: var(--lime);
    }

    .focus-card h2 {
      margin-bottom: 8px;
      font-size: 1.6rem;
    }

    .focus-card .focus-meta {
      color: rgba(248, 244, 232, 0.62);
      font-size: 0.78rem;

    function defaultState() {
      return {
        completed: {},
        notes: {},
        quizBest: null
      };
    }

    function normalizeState(raw) {
      const base = defaultState();
      if (!raw || typeof raw !== "object") {
        return base;
      }
      const completed = {};
      if (raw.completed && typeof raw.completed === "object") {
        Object.keys(raw.completed).forEach((key) => {
          if (raw.completed[key]) {
            completed[key] = true;
          }
        });
      }
      const notes = {};
      if (raw.notes && typeof raw.notes === "object") {
        Object.keys(raw.notes).forEach((key) => {
          if (typeof raw.notes[key] === "string") {
            notes[key] = raw.notes[key];
          }
        });
      }
      const bestNumber = Number(raw.quizBest);
      const quizBest = raw.quizBest !== null && raw.quizBest !== undefined && Number.isFinite(bestNumber)
        ? Math.max(0, Math.min(8, bestNumber))
        : null;
      return { completed, notes, quizBest };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? normalizeState(JSON.parse(raw)) : defaultState();
      } catch (error) {
        return defaultState();
      }
    }

    function esc(value) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };
      return String(value ?? "").replace(/[&<>"']/g, (char) => map[char]);
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

      return Boolean(state.completed[id]);

    function weekStats(week) {
      const total = week.days.length + week.acceptance.length;
      let done = 0;
      week.days.forEach((_, index) => {
        if (isDone(`${week.id}-d${index}`)) {
          done += 1;
        }
      });
      week.acceptance.forEach((_, index) => {
        if (isDone(`${week.id}-a${index}`)) {
          done += 1;
        }
      });
      return {
        done,
        total,
        pct: total ? Math.round((done / total) * 100) : 0
      };
    }

    function courseStats() {
      let total = 0;
      let done = 0;
      let remainingMinutes = 0;
      COURSE.forEach((week) => {
        week.days.forEach((day, index) => {
          total += 1;
          const id = `${week.id}-d${index}`;
          if (isDone(id)) {
            done += 1;
          } else {
            remainingMinutes += day.minutes;
          }
        });
        week.acceptance.forEach((_, index) => {
          total += 1;
          if (isDone(`${week.id}-a${index}`)) {
            done += 1;
          }
        });
      });
      return {
        total,
        done,
        pct: total ? Math.round((done / total) * 100) : 0,
        remainingMinutes
      };
    }

    function startQuiz() {
      currentQuiz = {
        questions: shuffle([...QUIZ]).slice(0, 8),
        index: 0,
        selected: null,
        score: 0,
        results: [],
        finished: false
      };
      renderQuiz();
    }

    function answerQuiz(index) {
      if (!currentQuiz || currentQuiz.selected !== null || currentQuiz.finished) {
        return;
      }
      currentQuiz.selected = index;
      const correct = index === currentQuiz.questions[currentQuiz.index].answer;
      if (correct) {
        currentQuiz.score += 1;
      }
      currentQuiz.results.push({
        questionIndex: currentQuiz.index,
        selected: index,
        correct
      });
      renderQuiz();
    }

    function nextQuizQuestion() {
      if (!currentQuiz || currentQuiz.selected === null || currentQuiz.finished) {
        return;
      }
      if (currentQuiz.index === currentQuiz.questions.length - 1) {
        currentQuiz.finished = true;
        state.quizBest = state.quizBest === null
          ? currentQuiz.score
          : Math.max(state.quizBest, currentQuiz.score);
        saveState();
      } else {
        currentQuiz.index += 1;
        currentQuiz.selected = null;
      }
      renderQuiz();
    }

      if (!currentQuiz) {
        viewRoot.innerHTML = `

          </section>
          <div class="quiz-shell">
            <div class="panel" style="text-align:center;padding:38px 24px;">
              <span class="badge">16 题 · 随机抽 8 题</span>
              <h2 style="margin-top:14px;">准备好了吗？</h2>
              <p>最佳成绩：<strong style="color:var(--accent);">${state.quizBest === null ? "还没有记录" : `${state.quizBest} / 8`}</strong></p>
              <button class="primary-btn" type="button" data-quiz-start>开始自测</button>
            </div>
          </div>
        `;
        return;
      }

      if (currentQuiz.finished) {
        const total = currentQuiz.questions.length;
        const pct = Math.round((currentQuiz.score / total) * 100);
        const verdict = pct >= 80
          ? "理解很扎实。接下来把知识放回项目里，继续做真实问题。"
          : pct >= 50
            ? "基础已经建立。回看错题对应的周，再做一次小练习。"
            : "别急着往下刷。先回到错题所在周，把概念用自己的话讲一遍。";
        viewRoot.innerHTML = `
          <section class="page-head">
            <div class="eyebrow">QUIZ RESULT</div>
            <h1>自测结果</h1>
          </section>
          <div class="quiz-shell">
            <div class="score-panel">
              <div class="eyebrow" style="color:#b9e07b;justify-content:center;">YOUR SCORE</div>
              <div class="score-number">${currentQuiz.score} / ${total}</div>
              <p>${verdict}</p>
              <div class="quiz-review">
                ${currentQuiz.questions.map((question, index) => {
                  const result = currentQuiz.results[index];
                  const selectedText = result ? question.options[result.selected] : "未作答";
                  const correctText = question.options[question.answer];
                  return `
                    <div class="review-row ${result && result.correct ? "good" : "bad"}">
                      <strong>${index + 1}. ${esc(question.q)}</strong>
                      <span>你的选择：${esc(selectedText)} · 正确答案：${esc(correctText)}</span>
                    </div>
                  `;
                }).join("")}
              </div>
              <div class="quiz-actions" style="justify-content:center;">
                <button class="primary-btn" type="button" data-quiz-start>再抽 8 题</button>
                <button class="secondary-btn" type="button" data-view="roadmap">回到路线</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const question = currentQuiz.questions[currentQuiz.index];
      const selected = currentQuiz.selected;
      const isCorrect = selected === question.answer;
      const progress = Math.round(((currentQuiz.index + 1) / currentQuiz.questions.length) * 100);
      viewRoot.innerHTML = `
        <section class="page-head">
          <div class="eyebrow">KNOWLEDGE CHECK</div>
          <h1>每周一个概念，<br>现在把它们连起来。</h1>
        </section>
        <div class="quiz-shell">
          <div class="quiz-topline">
            <span>第 ${currentQuiz.index + 1} / ${currentQuiz.questions.length} 题</span>
            <span>已答对 ${currentQuiz.score} 题</span>
          </div>
          <div class="quiz-progress"><i style="width:${progress}%"></i></div>
          <div class="quiz-card">
            <span class="badge">第 ${question.week} 周 · ${esc(question.category)}</span>
            <h2>${esc(question.q)}</h2>
            <div class="quiz-options">
              ${question.options.map((option, index) => {
                let className = "";
                if (selected !== null) {
                  if (index === question.answer) {
                    className = "correct";
                  } else if (index === selected) {
                    className = "wrong";
                  }
                }
                return `<button class="quiz-option ${className}" type="button" data-quiz-option="${index}" ${selected !== null ? "disabled" : ""}>${esc(option)}</button>`;
              }).join("")}
            </div>
            ${selected !== null ? `
              <div class="quiz-feedback ${isCorrect ? "" : "bad"}">
                <strong>${isCorrect ? "答对了" : "这次没有答对"}</strong>
                ${esc(question.explain)}
              </div>
              <div class="quiz-actions">
                <button class="primary-btn" type="button" data-quiz-next>${currentQuiz.index === currentQuiz.questions.length - 1 ? "查看结果" : "下一题"}</button>
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderNotes() {
      let week = weekById(currentNotesWeekId) || COURSE[0];
      currentNotesWeekId = week.id;
      viewRoot.innerHTML = `
        <section class="page-head">
          <div class="eyebrow">REFLECTION LOG</div>
          <h1>学习不是“看过了”，<br>是能说清楚发生了什么。</h1>
          <p>每周花 15 分钟写三件事：交付了什么、卡在哪里、下周最重要的一件事。记录会保存在当前浏览器，不会上传。</p>
        </section>

        <div class="week-picker">
          ${COURSE.map((item) => `
            <button class="chip ${item.id === week.id ? "active" : ""}" type="button" data-note-week="${item.id}">
              W${String(item.week).padStart(2, "0")}
            </button>
          `).join("")}
        </div>

        <div class="notes-layout">
          <div class="notes-panel">
            <div class="eyebrow">WEEK ${String(week.week).padStart(2, "0")} · ${esc(week.title)}</div>
            <h2 style="font-size:1.5rem;">本周复盘</h2>
            <p style="font-size:.8rem;">不用写长。每格写 1–3 句，能指导下周行动就够了。</p>
            ${weekNotesHTML(week)}
          </div>
          <div class="notes-panel">
            <div class="eyebrow">OPEN LOG</div>
            <h2 style="font-size:1.5rem;">自由笔记</h2>
            <p style="font-size:.8rem;">适合记录术语、报错、灵感或想问的问题。下次打开页面时还会在这里。</p>
            <div class="note-field">
              <label for="free-note-${week.id}">想到什么就写什么</label>
              <textarea class="large" id="free-note-${week.id}" data-note-key="${week.id}:free" placeholder="今天最大的收获 / 还没懂的概念 / 想问的问题……">${esc(getNote(`${week.id}:free`))}</textarea>
            </div>
            <div class="data-actions">
              <button class="secondary-btn" type="button" data-action="export">导出学习记录</button>
              <button class="ghost-btn" type="button" data-action="trigger-import">导入记录</button>
              <input id="importFile" type="file" accept="application/json,.json" hidden>
            </div>
            <div class="danger-zone">
              <p>重置会清空所有勾选、复盘和自测最佳成绩。确定要重新开始时再操作。</p>
              <button class="danger-btn" type="button" data-action="reset">清空所有记录</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderWeekNav() {
      weekNav.innerHTML = COURSE.map((week) => `
        <button class="week-nav-item" type="button" data-week="${week.id}">
          <span class="week-dot">${String(week.week).padStart(2, "0")}</span>
          <span class="week-nav-text">
            <strong>${esc(week.title)}</strong>
            <small data-week-count="${week.id}">0 / 0</small>
          </span>
          <span class="week-nav-bar"><i data-week-bar="${week.id}"></i></span>
        </button>
      `).join("");
    }

    function updateNavActive() {
      document.querySelectorAll(".nav-item").forEach((button) => {
        button.classList.toggle("active", currentView === button.dataset.view);
      });
      document.querySelectorAll(".week-nav-item").forEach((button) => {
        button.classList.toggle("active", currentView === "week" && button.dataset.week === currentWeekId);
      });

      let title = VIEW_TITLES[currentView] || "学习总览";
      if (currentView === "week") {
        const week = weekById(currentWeekId);
        title = week ? `8 周路线 / 第 ${week.week} 周 · ${week.title}` : "8 周路线";
      }
      breadcrumb.innerHTML = `<strong>${esc(title)}</strong>`;
    }

    function refreshProgress() {
      const stats = courseStats();
      const prep = prepStats();

      document.querySelectorAll("[data-course-percent]").forEach((element) => {
        element.textContent = `${stats.pct}%`;
      });
      document.querySelectorAll("[data-course-done]").forEach((element) => {
        element.textContent = String(stats.done);
      });
      document.querySelectorAll("[data-course-total]").forEach((element) => {
        element.textContent = String(stats.total);
      });
      document.querySelectorAll("[data-remaining-hours]").forEach((element) => {
        element.textContent = stats.remainingMinutes
          ? (stats.remainingMinutes / 60).toFixed(1)
          : "0";
      });
      document.querySelectorAll("[data-quiz-best]").forEach((element) => {
        element.textContent = state.quizBest === null ? "--" : `${state.quizBest} / 8`;
      });

      sideRing.style.setProperty("--p", `${stats.pct}%`);
      sidePercent.textContent = `${stats.pct}%`;
      sideCount.textContent = `${stats.done} / ${stats.total} 个行动项`;

      COURSE.forEach((week) => {
        const current = weekStats(week);
        document.querySelectorAll(`[data-week-count="${week.id}"]`).forEach((element) => {
          element.textContent = `${current.done} / ${current.total}`;
        });
        document.querySelectorAll(`[data-week-bar="${week.id}"]`).forEach((element) => {
          element.style.width = `${current.pct}%`;
        });
        document.querySelectorAll(`[data-week-percent="${week.id}"]`).forEach((element) => {
          element.textContent = `${current.pct}%`;
        });
      });

      const weekRing = document.getElementById("weekRing");
      if (weekRing && currentWeekId) {
        weekRing.style.setProperty("--p", `${weekStats(weekById(currentWeekId)).pct}%`);
      }

      const prepBar = document.getElementById("prepBar");
      const prepCount = document.getElementById("prepCount");
      if (prepBar) {
        prepBar.style.width = `${prep.pct}%`;
      }
      if (prepCount) {
        prepCount.textContent = `${prep.done} / ${prep.total} 必做已完成`;
      }

      const nextBody = document.getElementById("nextActionBody");
      if (nextBody) {
        nextBody.innerHTML = nextActionHTML();
      }
    }

    function renderCurrentView() {
      if (currentView === "dashboard") {
        renderDashboard();
      } else if (currentView === "roadmap") {
        renderRoadmap();
      } else if (currentView === "week") {
        renderWeek(currentWeekId);
      } else if (currentView === "resources") {
        renderResources();
      } else if (currentView === "quiz") {
        renderQuiz();
      } else if (currentView === "notes") {
        renderNotes();
      }
      refreshProgress();
    }

    function closeMobileNav() {
      document.body.classList.remove("nav-open");
      menuBtn.setAttribute("aria-expanded", "false");
    }

    function navigate(view, options = {}) {
      currentView = view;
      if (view !== "week") {
        currentWeekId = null;
      }
      closeMobileNav();
      updateNavActive();
      renderCurrentView();
      if (options.scroll !== false) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function openWeek(weekId, focusId = null) {
      if (!weekById(weekId)) {
        return;
      }
      currentWeekId = weekId;
      currentView = "week";
      closeMobileNav();
      updateNavActive();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (focusId) {
        window.setTimeout(() => {
          const target = document.getElementById(focusId);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }, 120);
      }
    }

    function resolveTask(id) {
      if (id.startsWith("prep-")) {
        const prep = PREP.find((item) => item.id === id);
        if (!prep) {
          return null;
        }
        return {
          type: "prep",
          id: prep.id,
          title: prep.title,
          detail: prep.detail,
          output: "完成开跑准备。",
          minutes: prep.minutes
        };
      }

      const parts = id.split("-");
      const week = weekById(parts[0]);
      const kind = parts[1] ? parts[1][0] : "";
      const index = Number(parts[1] ? parts[1].slice(1) : NaN);
      if (!week || Number.isNaN(index)) {
        return null;
      }
      if (kind === "d" && week.days[index]) {
        const day = week.days[index];
        return {
          type: "day",
          id,
          week,
          title: `${day.day} · ${day.title}`,
          detail: day.task,
          output: day.output,
          minutes: day.minutes
        };
      }
      if (kind === "a" && week.acceptance[index]) {
        return {
          type: "acceptance",
          id,
          week,
          title: `第 ${week.week} 周验收`,
          detail: week.acceptance[index],
          output: "完成一个验收项。",
          minutes: 20
        };
      }
      return null;
    }

    function toggleTask(id, checked, options = {}) {
      if (checked) {
        state.completed[id] = true;
      } else {
        delete state.completed[id];
      }
      saveState();

      const row = document.getElementById(id);
      if (row) {
        row.classList.toggle("done", checked);
        const checkbox = row.querySelector(`input[data-task-id="${id}"]`);
        if (checkbox) {
          checkbox.checked = checked;
        }
      }
      const rhythm = document.querySelector(`[data-rhythm-id="${id}"]`);
      if (rhythm) {
        rhythm.classList.toggle("done", checked);
      }

      refreshProgress();
      if (!options.silent) {
        const task = resolveTask(id);
        showToast(checked ? `已打卡 · ${task ? task.title : "这一项"}` : "已取消打卡");
      }
      const allStats = courseStats();
      if (checked && allStats.done === allStats.total) {
        showToast("主线完成。现在去整理复盘，并选择下一阶段方向。");
      }
    }

    function formatClock(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function updateFocusClock() {
      focusClock.textContent = formatClock(Math.max(0, focusSeconds));
    }

    function clearFocusTimer() {
      if (focusTimer) {
        window.clearInterval(focusTimer);
        focusTimer = null;
      }
      focusRunning = false;
    }

    function tickFocus() {
      if (!focusRunning) {
        return;
      }
      focusSeconds = Math.max(0, Math.ceil((focusEndAt - Date.now()) / 1000));
      updateFocusClock();
      if (focusSeconds <= 0) {
        clearFocusTimer();
        focusStart.textContent = "时间到";
        focusComplete.focus();
        showToast("25 分钟到了。先记下进展，再决定是否继续。");
      }
    }

    function startFocus(task) {
      if (!task) {
        showToast("还没有可执行的下一步。");
        return;
      }
      focusTask = task;
      clearFocusTimer();
      focusSeconds = 25 * 60;
      updateFocusClock();
      focusTitle.textContent = task.title;
      focusMeta.textContent = `${task.minutes} 分钟 · ${task.detail}`;
      focusStart.textContent = "开始计时";
      focusComplete.textContent = isDone(task.id) ? "已完成，关闭" : "完成并打卡";
      focusModal.hidden = false;
      document.body.style.overflow = "hidden";
      focusStart.focus();
    }

    function closeFocus() {
      clearFocusTimer();
      focusModal.hidden = true;
      document.body.style.overflow = "";
      focusTask = null;
    }

    function startFocusById(id) {
      startFocus(resolveTask(id));
    }

    function exportState() {
      const payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      anchor.href = url;
      anchor.download = `ai-learning-progress-${date}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
      showToast("学习记录已导出。");
    }

    function importState(file) {
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          const raw = parsed && parsed.state ? parsed.state : parsed;
          if (!raw || (!raw.completed && !raw.notes)) {
            throw new Error("缺少学习记录");
          }
          if (!window.confirm("导入会覆盖当前浏览器里的进度和笔记，确定继续吗？")) {
            return;
          }
          state = normalizeState(raw);
          saveState();
          renderCurrentView();
          updateNavActive();
          showToast("学习记录已导入。");
        } catch (error) {
          showToast("导入失败：文件不是有效的学习记录。");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function resetAll() {
      if (!window.confirm("确定清空所有勾选、复盘和自测成绩吗？此操作不可撤销。")) {
        return;
      }
      state = defaultState();
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        // 忽略浏览器禁用 localStorage 的情况。
      }
      currentQuiz = null;
      renderCurrentView();
      updateNavActive();
      showToast("所有学习记录已清空。");
    }

    function handleAction(action) {
      if (action === "export") {
        exportState();
        return;
      }
      if (action === "go-next") {
        const next = getNextAction();
        if (!next) {
          return;
        }
        if (next.type === "prep") {
          document.getElementById("prepCard")?.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          openWeek(next.week.id, next.id);
        }
        return;
      }
      if (action === "go-prep") {
        document.getElementById("prepCard")?.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      if (action === "focus-next") {
        startFocus(getNextAction());
        return;
      }
      if (action === "print") {
        window.print();
        return;
      }
      if (action === "trigger-import") {
        document.getElementById("importFile")?.click();
        return;
      }
      if (action === "reset") {
        resetAll();
      }
    }

    document.addEventListener("click", (event) => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        navigate(viewButton.dataset.view);
        return;
      }

      const noteWeekButton = event.target.closest("[data-note-week]");
      if (noteWeekButton) {
        currentNotesWeekId = noteWeekButton.dataset.noteWeek;
        renderNotes();
        refreshProgress();
        return;
      }

      const weekButton = event.target.closest("[data-week]");
      if (weekButton) {
        openWeek(weekButton.dataset.week);
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (actionButton) {
        handleAction(actionButton.dataset.action);
        return;
      }

      const focusButton = event.target.closest("[data-focus-id]");
      if (focusButton) {
        startFocusById(focusButton.dataset.focusId);
        return;
      }

      const quizStart = event.target.closest("[data-quiz-start]");
      if (quizStart) {
        startQuiz();
        return;
      }

      const quizOption = event.target.closest("[data-quiz-option]");
      if (quizOption) {
        answerQuiz(Number(quizOption.dataset.quizOption));
        return;
      }

      const quizNext = event.target.closest("[data-quiz-next]");
      if (quizNext) {
        nextQuizQuestion();
        return;
      }

      const filterButton = event.target.closest("[data-resource-filter]");
      if (filterButton) {
        resourceFilter = filterButton.dataset.resourceFilter;
        updateResourceList();
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-task-id]")) {
        toggleTask(event.target.dataset.taskId, event.target.checked);
        return;
      }
      if (event.target.id === "importFile") {
        importState(event.target.files?.[0]);
        event.target.value = "";
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.matches("[data-note-key]")) {
        state.notes[event.target.dataset.noteKey] = event.target.value;
        saveState();
        return;
      }
      if (event.target.id === "resourceSearch") {
        resourceQuery = event.target.value;
        updateResourceList();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !focusModal.hidden) {
        closeFocus();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"][data-week]')) {
        event.preventDefault();
        openWeek(event.target.dataset.week);
      }
    });

    menuBtn.addEventListener("click", () => {
      const open = document.body.classList.toggle("nav-open");
      menuBtn.setAttribute("aria-expanded", String(open));
    });

    mobileBackdrop.addEventListener("click", closeMobileNav);

    focusClose.addEventListener("click", closeFocus);
    focusReset.addEventListener("click", () => {
      clearFocusTimer();
      focusSeconds = 25 * 60;
      updateFocusClock();
      focusStart.textContent = "开始计时";
    });

    focusStart.addEventListener("click", () => {
      if (!focusTask) {
        return;
      }
      if (focusRunning) {
        clearFocusTimer();
        focusStart.textContent = "继续计时";
        return;
      }
      if (focusSeconds <= 0) {
        focusSeconds = 25 * 60;
      }
      focusEndAt = Date.now() + focusSeconds * 1000;
      focusRunning = true;
      focusStart.textContent = "暂停";
      focusTimer = window.setInterval(tickFocus, 250);
      tickFocus();
    });

    focusComplete.addEventListener("click", () => {
      if (!focusTask) {
        closeFocus();
        return;
      }
      const id = focusTask.id;
      const wasDone = isDone(id);
      if (!wasDone) {
        state.completed[id] = true;
        saveState();
        const row = document.getElementById(id);
        if (row) {
          row.classList.add("done");
          const checkbox = row.querySelector(`input[data-task-id="${id}"]`);
          if (checkbox) {
            checkbox.checked = true;
          }
        }
        const rhythm = document.querySelector(`[data-rhythm-id="${id}"]`);
        if (rhythm) {
          rhythm.classList.add("done");
        }
        refreshProgress();
        showToast(`已打卡 · ${focusTask.title}`);
      }
      closeFocus();
    });

    renderWeekNav();
    updateNavActive();
    renderCurrentView();
    refreshProgress();
  </script>
</body>
</html>
